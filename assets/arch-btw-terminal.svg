<svg width="760" height="500" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1c1730"/>
      <stop offset="55%" stop-color="#100e18"/>
      <stop offset="100%" stop-color="#0a0910"/>
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#5fd3f3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="498" rx="12" fill="url(#bgGlow)" stroke="#3b3654" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="758" height="36" rx="12" fill="#15131f"/>
  <rect x="1" y="23" width="758" height="14" fill="#15131f"/>
  <text x="380" y="24" text-anchor="middle" fill="#9a94b5" font-size="13">mamad2411@arch: ~</text>

  <!-- gnome-style window controls, right side -->
  <g stroke="#8b85a3" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="662" cy="19" r="6.5"/>
    <line x1="666.5" y1="23.5" x2="672" y2="29"/>
    <line x1="694" y1="14" x2="694" y2="24"/>
    <line x1="689" y1="19" x2="699" y2="19"/>
    <line x1="716" y1="14" x2="726" y2="14"/>
    <line x1="716" y1="19" x2="726" y2="19"/>
    <line x1="716" y1="24" x2="726" y2="24"/>
  </g>
  <g stroke="#e35b5b" stroke-width="1.8" stroke-linecap="round">
    <line x1="742" y1="13" x2="750" y2="25"/>
    <line x1="750" y1="13" x2="742" y2="25"/>
  </g>

  <!-- prompt -->
  <text x="20" y="60" font-size="14.5" fill="#f8f8f2">[<tspan fill="#50fa7b">mamad2411</tspan><tspan fill="#f8f8f2">@</tspan><tspan fill="#50fa7b">arch</tspan><tspan fill="#f8f8f2"> ~]$ </tspan><tspan fill="#8be9fd">neofetch</tspan></text>

  <!-- arch ascii logo (explicit x offsets recreate the pyramid silhouette) -->
  <g font-size="11.5" fill="url(#archGrad)" font-weight="600">
    <text x="134" y="90">-`</text>
    <text x="128" y="103">.o+`</text>
    <text x="122" y="116">`ooo/</text>
    <text x="116" y="129">`+oooo:</text>
    <text x="110" y="142">`+oooooo:</text>
    <text x="110" y="155">-+oooooo+:</text>
    <text x="98" y="168">`/:-:++oooo+:</text>
    <text x="92" y="181">`/++++/+++++++:</text>
    <text x="86" y="194">`/++++++++++++++:</text>
    <text x="80" y="207">`/+++ooooooooooooo/`</text>
    <text x="74" y="220">./ooosssso++osssssso+`</text>
    <text x="68" y="233">.oossssso-````/ossssss+`</text>
    <text x="62" y="246">-osssssso.      :ssssssso.</text>
    <text x="56" y="259">:osssssss/        osssso+++.</text>
    <text x="50" y="272">/ossssssss/        +ssssooo/-</text>
    <text x="38" y="285">`/ossssso+/:-        -:/+osssso+-</text>
    <text x="32" y="298">`+sso+:-`                 `.-/+oso:</text>
    <text x="32" y="311">`++:.                           `-/+/</text>
    <text x="32" y="324">.`                                 `/</text>
  </g>

  <!-- system info -->
  <g font-size="13.5" fill="#f2f2f6">
    <text x="330" y="90"><tspan fill="#8be9fd" font-weight="700">mamad2411</tspan><tspan fill="#5c5876">@</tspan><tspan fill="#8be9fd" font-weight="700">arch</tspan></text>
    <line x1="330" y1="98" x2="470" y2="98" stroke="#5c5876" stroke-width="1"/>
    <text x="330" y="118"><tspan fill="#8be9fd" font-weight="700">OS</tspan>: Arch Linux x86_64</text>
    <text x="330" y="140"><tspan fill="#8be9fd" font-weight="700">Kernel</tspan>: 6.10.4-arch1-1</text>
    <text x="330" y="162"><tspan fill="#8be9fd" font-weight="700">Uptime</tspan>: 4 years, 2 months</text>
    <text x="330" y="184"><tspan fill="#8be9fd" font-weight="700">Packages</tspan>: 1337 (pacman)</text>
    <text x="330" y="206"><tspan fill="#8be9fd" font-weight="700">Shell</tspan>: zsh 5.9</text>
    <text x="330" y="228"><tspan fill="#8be9fd" font-weight="700">DE</tspan>: none (btw)</text>
    <text x="330" y="250"><tspan fill="#8be9fd" font-weight="700">WM</tspan>: Hyprland</text>
    <text x="330" y="272"><tspan fill="#8be9fd" font-weight="700">Editor</tspan>: VS Code / Neovim</text>
    <text x="330" y="294"><tspan fill="#8be9fd" font-weight="700">Languages</tspan>: TS, Dart, C#, JS</text>
    <text x="330" y="316"><tspan fill="#8be9fd" font-weight="700">Motto</tspan>: I use Arch btw</text>

    <g>
      <rect x="330" y="332" width="14" height="14" fill="#ff5555"/>
      <rect x="346" y="332" width="14" height="14" fill="#f1fa8c"/>
      <rect x="362" y="332" width="14" height="14" fill="#50fa7b"/>
      <rect x="378" y="332" width="14" height="14" fill="#8be9fd"/>
      <rect x="394" y="332" width="14" height="14" fill="#bd93f9"/>
      <rect x="410" y="332" width="14" height="14" fill="#ff79c6"/>
      <rect x="426" y="332" width="14" height="14" fill="#f8f8f2"/>
    </g>
  </g>

  <!-- second prompt -->
  <text x="20" y="378" font-size="14.5" fill="#f8f8f2">[<tspan fill="#50fa7b">mamad2411</tspan><tspan fill="#f8f8f2">@</tspan><tspan fill="#50fa7b">arch</tspan><tspan fill="#f8f8f2"> ~]$ </tspan><tspan fill="#8be9fd">echo</tspan><tspan fill="#f1fa8c"> "I use Arch btw"</tspan></text>

  <text x="20" y="428" font-size="34" font-weight="800" letter-spacing="1" fill="url(#archGrad)" filter="url(#glow)">
    I use Arch btw
    <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- final blinking prompt -->
  <text x="20" y="470" font-size="14.5" fill="#f8f8f2">[<tspan fill="#50fa7b">mamad2411</tspan><tspan fill="#f8f8f2">@</tspan><tspan fill="#50fa7b">arch</tspan><tspan fill="#f8f8f2"> ~]$</tspan></text>
  <rect x="188" y="457" width="10" height="16" fill="#8be9fd">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
