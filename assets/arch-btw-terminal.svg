    <text x="24" y="164">            \`/:-:++oooo+:</text>
    <text x="24" y="176">           \`/++++/+++++++:</text>
    <text x="24" y="188">          \`/++++++++++++++:</text>
    <text x="24" y="200">         \`/+++o oooooooo/\`</text>
    <text x="24" y="212">        ./ooosssso++osssssso+\`</text>
