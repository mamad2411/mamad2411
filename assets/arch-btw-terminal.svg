<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="798" height="358" rx="14" fill="url(#bgGrad)" stroke="#bd93f9" stroke-opacity="0.55" stroke-width="1.5"/>

  <rect x="1" y="1" width="798" height="38" rx="14" fill="#161822"/>
  <rect x="1" y="25" width="798" height="14" fill="#161822"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6.5" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6.5" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b8fa3" font-size="13">mamad2411@arch: ~/projects</text>

  <text x="24" y="70" font-size="15" fill="#50fa7b">$ <tspan fill="#f8f8f2">neofetch</tspan></text>

