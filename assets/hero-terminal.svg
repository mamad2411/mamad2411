<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace">
  <defs>
    <clipPath id="cWho"><rect x="282" y="72" height="26" width="0"><animate attributeName="width" from="0" to="80" dur="0.5s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></rect></clipPath>
    <clipPath id="cCat"><rect x="282" y="284" height="26" width="0"><animate attributeName="width" from="0" to="150" dur="0.6s" begin="3.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/></rect></clipPath>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bd93f9"/></linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="398" rx="14" fill="#0a0b0f" stroke="#22242e" stroke-width="1.5"/>
  <rect x="1" y="1" width="818" height="46" rx="14" fill="#15161d"/>
  <rect x="1" y="33" width="818" height="14" fill="#15161d"/>
  <circle cx="32" cy="24" r="7" fill="#ff5f56"/><circle cx="56" cy="24" r="7" fill="#ffbd2e"/><circle cx="80" cy="24" r="7" fill="#27c93f"/>
  <text x="410" y="29" text-anchor="middle" fill="#7d818f" font-size="15">mamad2411@github: ~ — -zsh</text>

  <!-- prompt 1 -->
  <text x="40" y="92" font-size="20"><tspan fill="#2ecc71" font-weight="700">mamad2411</tspan><tspan fill="#e6e6e6">@github</tspan><tspan fill="#7d818f">:~$ </tspan></text>
  <text x="282" y="92" font-size="20" fill="#e6e6e6" clip-path="url(#cWho)">whoami</text>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="0.9s" fill="freeze"/>
    <text x="40" y="140" font-size="34" font-weight="800" fill="#f2f2f2">Ahmad Zaidan Ali</text>
  </g>
  <rect x="40" y="152" width="0" height="3" rx="1.5" fill="url(#bar)">
    <animate attributeName="width" from="0" to="300" dur="0.7s" begin="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- roles, staggered -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur="0.4s" begin="1.7s" fill="freeze"/>
    <text x="40" y="190" font-size="20" fill="#58a6ff" font-weight="600">&gt; Mobile Engineer</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur="0.4s" begin="2.1s" fill="freeze"/>
    <text x="40" y="220" font-size="20" fill="#bd93f9" font-weight="600">&gt; AI Engineer</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" dur="0.4s" begin="2.5s" fill="freeze"/>
    <text x="40" y="250" font-size="20" fill="#50fa7b" font-weight="600">&gt; IoT Engineer</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>
    <text x="300" y="190" font-size="14" fill="#7d818f">// Flutter · Kotlin · Swift</text>
    <text x="300" y="220" font-size="14" fill="#7d818f">// PyTorch · TensorFlow · OpenCV</text>
    <text x="300" y="250" font-size="14" fill="#7d818f">// Arduino · Raspberry Pi · ROS</text></g>

  <!-- prompt 2 -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.1s" fill="freeze"/>
    <text x="40" y="304" font-size="20"><tspan fill="#2ecc71" font-weight="700">mamad2411</tspan><tspan fill="#e6e6e6">@github</tspan><tspan fill="#7d818f">:~$ </tspan></text></g>
  <text x="282" y="304" font-size="20" fill="#e6e6e6" clip-path="url(#cCat)">cat bio.txt</text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4s" fill="freeze"/>
    <text x="40" y="344" font-size="18" fill="#9aa0aa">"Code your dreams into reality!"</text></g>

  <!-- cursor -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.4s" fill="freeze"/>
    <text x="40" y="378" font-size="20"><tspan fill="#2ecc71" font-weight="700">mamad2411</tspan><tspan fill="#e6e6e6">@github</tspan><tspan fill="#7d818f">:~$</tspan></text>
    <rect x="268" y="363" width="11" height="20" fill="#e6e6e6">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
</svg>
